version: '3.8'

services:
  quantvision-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quantvision-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  quantvision-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: quantvision-frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - quantvision-backend

  quantvision-airflow-scheduler:
    image: quantvision-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: quantvision-airflow-scheduler
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow.db
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    command: bash -c "airflow db migrate && airflow scheduler"

  quantvision-airflow-webserver:
    image: quantvision-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: quantvision-airflow-webserver
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow.db
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    ports:
      - "8080:8080"
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true && airflow webserver"
    depends_on:
      - quantvision-airflow-scheduler
